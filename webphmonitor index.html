<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pH Sensor Monitor</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    margin: 0;
    padding: 20px;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .card {
    background: #1e293b;
    border-radius: 12px;
    padding: 16px;
    border: 1px solid #334155;
  }
  .card .label { font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
  .card .value { font-size: 26px; font-weight: 700; }
  .card .value.ph { color: #4ade80; }
  .card .value.v { color: #60a5fa; }
  .panel {
    background: #1e293b;
    border-radius: 12px;
    padding: 16px;
    border: 1px solid #334155;
    margin-bottom: 20px;
  }
  .panel h2 { font-size: 15px; margin: 0 0 12px 0; }
  canvas { max-height: 260px; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  button {
    background: #334155;
    color: #e2e8f0;
    border: 1px solid #475569;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { background: #475569; }
  button.danger { border-color: #7f1d1d; color: #fca5a5; }
  button.warn { border-color: #78350f; color: #fcd34d; }
  .status-line { font-size: 13px; color: #94a3b8; margin-top: 10px; line-height: 1.6; }
  .status-line b { color: #e2e8f0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td, th { padding: 6px 8px; border-bottom: 1px solid #334155; text-align: left; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; }
  .badge.ok { background: #14532d; color: #86efac; }
  .badge.no { background: #451a03; color: #fcd34d; }
</style>
</head>
<body>

<h1>pH Sensor Monitor</h1>
<div class="sub">DFRobot Gravity pH V2.0 &middot; ESP32-S3 &middot; Live via Firebase</div>

<div class="grid">
  <div class="card">
    <div class="label">pH Sekarang</div>
    <div class="value ph" id="phNow">--</div>
  </div>
  <div class="card">
    <div class="label">Voltage</div>
    <div class="value v" id="voltNow">-- mV</div>
  </div>
  <div class="card">
    <div class="label">Update Terakhir</div>
    <div class="value" id="lastUpdate" style="font-size:14px;">--</div>
  </div>
</div>

<div class="panel">
  <h2>Grafik pH (50 data terakhir)</h2>
  <canvas id="phChart"></canvas>
</div>

<div class="panel">
  <h2>Kalibrasi</h2>
  <table>
    <tr><th>Titik</th><th>Voltage</th><th>Status</th></tr>
    <tr><td>pH 4.01</td><td id="cal4v">--</td><td id="cal4s">--</td></tr>
    <tr><td>pH 6.86</td><td id="cal7v">--</td><td id="cal7s">--</td></tr>
    <tr><td>pH 9.18</td><td id="cal10v">--</td><td id="cal10s">--</td></tr>
  </table>
  <div class="status-line" id="calEquation"></div>

  <div class="btn-row">
    <button onclick="sendCommand('4')">Kalibrasi pH 4.01</button>
    <button onclick="sendCommand('7')">Kalibrasi pH 6.86</button>
    <button onclick="sendCommand('10')">Kalibrasi pH 9.18</button>
    <button class="warn" onclick="sendCommand('cancel')">Batal Kalibrasi</button>
    <button class="danger" onclick="confirmReset()">Reset Semua Kalibrasi</button>
  </div>

  <div class="status-line" id="calStatus">Belum ada proses kalibrasi berjalan.</div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCt4Ij7antLWcSrFzDOzQSWcM2yhEMNGD0",
    authDomain: "ph-sensor-monitor-11e27.firebaseapp.com",
    databaseURL: "https://ph-sensor-monitor-11e27-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "ph-sensor-monitor-11e27",
    storageBucket: "ph-sensor-monitor-11e27.firebasestorage.app",
    messagingSenderId: "94345653572",
    appId: "1:94345653572:web:59b175dedbf45bd5363b11"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  db.ref("/ph_sensor/latest").on("value", (snap) => {
    const data = snap.val();
    if (!data) return;

    document.getElementById("phNow").textContent =
      (data.ph !== undefined) ? Number(data.ph).toFixed(2) : "--";
    document.getElementById("voltNow").textContent =
      Number(data.voltage).toFixed(2) + " mV";

    if (data.timestamp) {
      const d = new Date(data.timestamp * 1000);
      document.getElementById("lastUpdate").textContent = d.toLocaleString("id-ID");
    }
  });

  const ctx = document.getElementById("phChart").getContext("2d");
  const chart = new Chart(ctx, {
    type: "line",
    data: {
      labels: [],
      datasets: [{
        label: "pH",
        data: [],
        borderColor: "#4ade80",
        backgroundColor: "rgba(74,222,128,0.1)",
        tension: 0.3,
        pointRadius: 2
      }]
    },
    options: {
      responsive: true,
      scales: {
        x: { ticks: { color: "#94a3b8", maxTicksLimit: 8 }, grid: { color: "#334155" } },
        y: { ticks: { color: "#94a3b8" }, grid: { color: "#334155" } }
      },
      plugins: { legend: { labels: { color: "#e2e8f0" } } }
    }
  });

  db.ref("/ph_sensor/readings").limitToLast(50).on("value", (snap) => {
    const data = snap.val();
    if (!data) return;

    const entries = Object.values(data).sort((a, b) => a.timestamp - b.timestamp);

    chart.data.labels = entries.map(e =>
      new Date(e.timestamp * 1000).toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" })
    );
    chart.data.datasets[0].data = entries.map(e => e.ph !== undefined ? e.ph : null);
    chart.update();
  });

  db.ref("/ph_sensor/calibration/points").on("value", (snap) => {
    const p = snap.val();
    if (!p) return;

    const setRow = (key, voltEl, statusEl) => {
      const point = p[key];
      document.getElementById(voltEl).textContent =
        point && point.valid ? Number(point.voltage).toFixed(2) + " mV" : "--";
      document.getElementById(statusEl).innerHTML =
        point && point.valid
          ? '<span class="badge ok">OK</span>'
          : '<span class="badge no">Belum</span>';
    };

    setRow("ph4", "cal4v", "cal4s");
    setRow("ph7", "cal7v", "cal7s");
    setRow("ph10", "cal10v", "cal10s");
  });

  db.ref("/ph_sensor/calibration/equation").on("value", (snap) => {
    const eq = snap.val();
    if (!eq) return;

    document.getElementById("calEquation").innerHTML = eq.calibrated
      ? `<b>Persamaan:</b> V = ${Number(eq.slope).toFixed(4)} &times; pH + ${Number(eq.intercept).toFixed(4)} &middot; (${eq.numPoints} titik)`
      : "Belum terkalibrasi (minimal 2 titik dibutuhkan).";
  });

  db.ref("/ph_sensor/calibration/status").on("value", (snap) => {
    const s = snap.val();
    const el = document.getElementById("calStatus");

    if (!s) {
      el.textContent = "Belum ada proses kalibrasi berjalan.";
      return;
    }

    if (s.running) {
      el.innerHTML = `<b>Sedang kalibrasi ${s.label}</b> &middot; ${s.elapsedSec}s &middot; ` +
        `sample terpakai: ${s.sample} &middot; avg: ${Number(s.avgVoltage).toFixed(2)} mV &middot; ` +
        `range: ${Number(s.range).toFixed(2)} mV &middot; status: ${s.message}`;
    } else {
      el.innerHTML = `<b>Kalibrasi ${s.label} selesai</b> &middot; hasil akhir: ${Number(s.avgVoltage).toFixed(2)} mV ` +
        `&middot; range: ${Number(s.range).toFixed(2)} mV &middot; (${s.message})`;
    }
  });

  function sendCommand(cmd) {
    db.ref("/ph_sensor/calibration/command").set(cmd);
  }

  function confirmReset() {
    if (confirm("Yakin mau reset SEMUA data kalibrasi?")) {
      sendCommand("reset");
    }
  }
</script>

</body>
</html>
