; =====================================================================
;  Satu proyek, beberapa target. Pilih dengan -e:
;
;    pio run                                  -> env default (src/)
;    pio run -e kalibrasi-ph -t upload -t monitor
;
;  Di VSCode: pilih env lewat status bar PlatformIO, atau task
;  "PlatformIO: Build (kalibrasi-ph)".
; =====================================================================

[platformio]
src_dir = .
default_envs = esp32-s3-devkitc-1

; ---------------------------------------------------------------------
; Pengaturan bersama semua env
; ---------------------------------------------------------------------
[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Board ini tersambung lewat adapter FTDI ke UART0, bukan port USB native
; ESP32-S3. CDC_ON_BOOT=1 akan membuang seluruh Serial.print ke USB native
; yang tidak terpasang, sehingga monitor cuma menampilkan log ROM.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0

; ---------------------------------------------------------------------
; Kode utama di src/
; ---------------------------------------------------------------------
[env:esp32-s3-devkitc-1]
build_src_filter = -<*> +<src/>

lib_deps =
    bblanchon/ArduinoJson @ ^6.21.5

; ---------------------------------------------------------------------
; Kalibrasi pH  -  sumber di hydrosense/code kalibrasi ph/src
; Tanda '?' pada filter mewakili spasi di nama folder.
; ---------------------------------------------------------------------
[env:kalibrasi-ph]
build_src_filter = -<*> +<hydrosense/code?kalibrasi?ph/src/>

; Env ini dipakai lewat port USB native ESP32-S3 (VID 303A:1001), bukan FTDI,
; jadi Serial harus diarahkan ke USB CDC agar log tampil di monitor.
; Env ini terbukti menggunakan port USB native ESP32-S3 (COM5 putus-nyambung saat reset),
; jadi Serial MUTLAK harus diarahkan ke USB CDC (1) agar log tampil di monitor.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -I "hydrosense/code kalibrasi ph/include"

lib_ldf_mode = deep
lib_deps =
    4-20ma/ModbusMaster @ ^2.0.1
    bblanchon/ArduinoJson @ ^6.21.5
    Preferences
    WiFi
    HTTPClient
    WiFiClientSecure

; ---------------------------------------------------------------------
; Kalibrasi TSS
; ---------------------------------------------------------------------
[env:kalibrasi-tss]
build_src_filter = -<*> +<hydrosense/code?kalibrasi?tss/src/>
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -I "hydrosense/code kalibrasi tss/include"
lib_deps =
    4-20ma/ModbusMaster @ ^2.0.1

; ---------------------------------------------------------------------
; Kalibrasi Water Level
; ---------------------------------------------------------------------
[env:kalibrasi-water-level]
build_src_filter = -<*> +<hydrosense/code?kalibrasi?water?level/src/>
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -I "hydrosense/code kalibrasi water level/include"

; ---------------------------------------------------------------------
; Modul valve & pompa  -  sumber di hydrosense/code tes pompa
; ---------------------------------------------------------------------
[env:tes-pompa]
build_src_filter = -<*> +<hydrosense/code?tes?pompa/src/>
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -I "hydrosense/code tes pompa/include"

; ---------------------------------------------------------------------
; FULL CODE KERANGKA
; ---------------------------------------------------------------------
[env:full-code-kerangka]
build_src_filter = -<*> +<hydrosense/full?code?kerangka/src/>
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -I "hydrosense/full code kerangka/include"
lib_ldf_mode = deep
lib_deps =
    4-20ma/ModbusMaster @ ^2.0.1
    bblanchon/ArduinoJson @ ^6.21.5
    Preferences
    WiFi
    HTTPClient
    WiFiClientSecure

; ---------------------------------------------------------------------
; Ultrasonik RCWL 1655
; ---------------------------------------------------------------------
[env:ultrasonik]
board = esp32dev
build_src_filter = -<*> +<ultrasonik?RCWL?1655/src/>
build_flags = 
    -I "ultrasonik RCWL 1655/include"
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200