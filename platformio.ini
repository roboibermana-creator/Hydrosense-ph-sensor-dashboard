[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    4-20ma/ModbusMaster@^2.0.1
    bblanchon/ArduinoJson @ ^6.21.5
    vshymanskyy/TinyGSM @ ^0.12.0
    openslab-osu/SSLClient @ ^1.6.11

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Upload firmware lewat WiFi (ArduinoOTA, lihat src/OTA.cpp).
; Pakai: pio run -e ota -t upload
; Hostname = DEVICE_ID (Config.h); kalau mDNS tidak jalan, ganti upload_port
; dengan IP alat (lihat device_status.ip_address atau Serial Monitor).
; Password harus sama dengan OTA_PASSWORD di Config.h.
[env:ota]
extends = env:esp32-s3-devkitc-1
upload_protocol = espota
upload_port = hydrosense-inlet-01.local
upload_flags =
    --auth=hydrosense-ota
