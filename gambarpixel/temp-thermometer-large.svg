<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <linearGradient id="tempMerc" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ffab42"/>
    <stop offset="100%" stop-color="#ff5a3c"/>
  </linearGradient>
  <!-- glass tube -->
  <rect x="24" y="6" width="16" height="38" rx="8" fill="#e4eedb" stroke="#0f1a17" stroke-width="2"/>
  <!-- mercury column -->
  <rect x="29" y="22" width="6" height="22" fill="url(#tempMerc)"/>
  <!-- bulb -->
  <circle cx="32" cy="48" r="11" fill="#ff5a3c" stroke="#0f1a17" stroke-width="2"/>
  <circle cx="28" cy="45" r="2.5" fill="#ffd7a8" opacity="0.8"/>
  <!-- scale ticks -->
  <g stroke="#0f1a17" stroke-width="2">
    <line x1="42" y1="14" x2="48" y2="14"/>
    <line x1="42" y1="22" x2="46" y2="22"/>
    <line x1="42" y1="30" x2="48" y2="30"/>
    <line x1="42" y1="38" x2="46" y2="38"/>
  </g>
  <!-- heat shimmer -->
  <path d="M10 18 q3 -4 6 0 t6 0" fill="none" stroke="#ffab42" stroke-width="2" stroke-linecap="round"/>
  <path d="M8 28 q3 -4 6 0 t6 0" fill="none" stroke="#ffab42" stroke-width="2" stroke-linecap="round"/>
</svg>
