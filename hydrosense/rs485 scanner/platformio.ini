; =====================================================================
;  PlatformIO - RS485 Auto-Discovery
;  ESP32-S3 DevKitC-1 + shield industri
;
;  Project ini berdiri sendiri, TERPISAH dari firmware pH Anda.
;  Buka foldernya sebagai project baru di VS Code:
;      File > Open Folder > pilih folder rs485_scanner
;
;  Tidak butuh library eksternal sama sekali. Frame Modbus dan CRC-16
;  dibangun manual, supaya tidak ada variabel tambahan saat mendiagnosis
;  masalah komunikasi.
; =====================================================================

[env:esp32-s3-devkitc-1]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200

; Kalau board Anda varian N16R8 atau N8R8, aktifkan baris di bawah
; sesuai varian. Untuk sekadar menjalankan scanner ini, default
; biasanya sudah cukup.
; board_build.flash_size    = 16MB
; board_build.arduino.memory_type = qio_opi

build_flags =
    -DARDUINO_USB_MODE=1
    ; Board tersambung lewat FTDI ke UART0, bukan USB native ESP32-S3.
    ; Dengan =1, Serial.print dibuang ke USB native yang tidak terpasang.
    -DARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
    4-20ma/ModbusMaster @ ^2.0.1
